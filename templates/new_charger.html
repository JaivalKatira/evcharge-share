{% extends 'base.html' %}{% block content %}<section class="formbox"><h1>List your EV charger</h1><p>Enter a public meeting/access point, not a private home address unless you consent to publishing it.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Listing title<input name="title" required maxlength="110" placeholder="Type 2 charger by the mall"></label><label>Area<input name="area" required maxlength="100" placeholder="Andheri West"></label><label>Public location / directions<input name="address" required maxlength="255" placeholder="Parking entrance, landmark"></label><div class="two"><label>Latitude<input name="latitude" type="number" step="any" min="-90" max="90" required placeholder="19.120"></label><label>Longitude<input name="longitude" type="number" step="any" min="-180" max="180" required placeholder="72.830"></label></div><label>Connector<select name="connector" required><option>Type 2</option><option>CCS2</option><option>CHAdeMO</option><option>15A socket</option><option>Other</option></select></label><div class="two"><label>Power (kW)<input name="power_kw" type="number" min="0.1" max="500" step="any" required></label><label>Price/hour (₹)<input name="price_per_hour" type="number" min="1" max="100000" step="0.01" required></label></div><button class="wide">Publish charger</button></form></section>{% endblock %}
