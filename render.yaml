databases:
  - name: chargeneighbour-db
    databaseName: chargeneighbour
    user: chargeneighbour
    plan: basic
services:
  - type: web
    name: chargeneighbour
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: flask --app app init-db && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chargeneighbour-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: '1'
      - key: BEHIND_PROXY
        value: '1'
      - key: CARTO_BASEMAP_KEY
        sync: false
